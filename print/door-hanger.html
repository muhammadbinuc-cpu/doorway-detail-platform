<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doorway Detail — Door Hanger (Print)</title>
<style>
  /* Print spec: 4" × 9" finished + 1/8" bleed = 4.25in × 9.25in full art per side. */

  @page { size: 4.25in 9.25in; margin: 0; }

  html, body {
    margin: 0; padding: 0;
    background: #d4d4d4;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #111;
    -webkit-font-smoothing: antialiased;
  }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; box-sizing: border-box; }

  @media screen {
    body { padding: 24px 0; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .side { box-shadow: 0 6px 24px rgba(0,0,0,0.18); }
  }
  @media print {
    body { padding: 0; background: white; gap: 0; }
    .side { box-shadow: none; }
  }

  .side {
    width: 4.25in;
    height: 9.25in;
    background: #fff;
    position: relative;
    overflow: hidden;
    page-break-after: always;
    display: flex;
    flex-direction: column;
  }
  .side:last-child { page-break-after: auto; }

  /* ── Top punch clearance ── */
  .cutout-zone { height: 1.2in; flex-shrink: 0; }

  /* ─────────── SHARED HEADER (both sides identical) ─────────── */
  .header {
    text-align: center;
    padding: 0 0.2in;
    flex-shrink: 0;
  }
  .header img { width: 2.4in; height: auto; display: inline-block; }
  .header .rule {
    width: 2.6in;
    height: 0.012in;
    background: #C9A227;
    margin: 0.18in auto 0;
    border-radius: 0.01in;
  }

  /* ─────────── MIDDLE BODY (flex-grow so contact pins to bottom) ─────────── */
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 0.32in;
  }

  /* ─────────── SHARED CONTACT BLOCK (both sides identical) ─────────── */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.1in;
    margin: 0.22in 0 0.16in;
  }
  .divider .line { width: 0.5in; height: 0.012in; background: #C9A227; border-radius: 0.01in; }
  .divider .dot { width: 0.08in; height: 0.08in; background: #C9A227; border-radius: 50%; }

  .contact { text-align: center; padding-bottom: 0.22in; }
  .contact .phone {
    display: inline-flex;
    align-items: center;
    gap: 0.12in;
    font-size: 0.32in;
    font-weight: 900;
    color: #111;
    letter-spacing: 0.008in;
    line-height: 1;
  }
  .contact .phone-icon {
    width: 0.34in;
    height: 0.34in;
    border-radius: 50%;
    background: #C9A227;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .contact .web {
    display: inline-flex;
    align-items: center;
    gap: 0.07in;
    margin-top: 0.12in;
    font-size: 0.135in;
    font-weight: 600;
    color: #444;
  }

  /* ─────────── FOOTER BAND ─────────── */
  .footer-band {
    background: #C9A227;
    color: #fff;
    text-align: center;
    font-size: 0.13in;
    font-weight: 800;
    letter-spacing: 0.052in;
    padding: 0.13in 0;
    flex-shrink: 0;
  }

  /* ─────────── FRONT: vertical service list ─────────── */
  .services {
    margin: 0.32in auto 0;
    width: max-content;
    display: flex;
    flex-direction: column;
    gap: 0.2in;
    align-items: flex-start;
  }
  .services .item {
    display: flex;
    align-items: center;
    gap: 0.16in;
    font-size: 0.24in;
    font-weight: 700;
    color: #111;
    letter-spacing: -0.003in;
  }
  .services .spark {
    color: #C9A227;
    font-size: 0.24in;
    line-height: 1;
  }

  /* ─────────── BACK: headline + promo + QR + scan button ─────────── */
  .headline {
    text-align: center;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 900;
    font-size: 0.4in;
    line-height: 1.05;
    color: #111;
    margin-top: 0.32in;
    letter-spacing: -0.004in;
  }
  .headline .accent { color: #C9A227; }

  .promo-line {
    text-align: center;
    margin-top: 0.18in;
    font-size: 0.14in;
    line-height: 1.5;
    color: #555;
    font-weight: 500;
  }
  .promo-line .code {
    background: #111;
    color: #C9A227;
    font-weight: 800;
    padding: 0.03in 0.09in;
    border-radius: 0.05in;
    letter-spacing: 0.022in;
    margin: 0 0.02in;
  }
  .promo-line .amount {
    color: #111;
    font-weight: 800;
  }

  .qr-wrap {
    margin: 0.28in auto 0;
    width: 2.5in;
    height: 2.5in;
    padding: 0.1in;
    background: #fff;
    border: 0.02in solid #C9A227;
    border-radius: 0.08in;
  }
  .qr-wrap svg { width: 100%; height: 100%; display: block; }

  .scan-btn-wrap { text-align: center; margin-top: 0.2in; }
  .scan-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.1in;
    background: #C9A227;
    color: #111;
    font-weight: 900;
    font-size: 0.17in;
    letter-spacing: 0.026in;
    padding: 0.12in 0.3in;
    border-radius: 999px;
    box-shadow: 0 0.04in 0.1in rgba(201, 162, 39, 0.32);
  }

  .icon { display: inline-block; vertical-align: middle; }
</style>
</head>

      <div class="web">

          <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>

</div>
